# Parser quality cases for scripts/eval_parser.py. Run by hand; not part of the test suite.
# Each case: the scene (`zone`, optional `outbreak`, `sneaking`), the player's `input`,
# and the `expect`ed ACTIONS lines in order. `[]` means NONE. A TALK line is judged by
# whether it carries words (`"words"` stands for any), not by what they are; an UNSUPPORTED
# line by its verb alone. `carrying` lists item ids in the inventory.
- name: creep to the lobby
  zone: zone_home
  input: I creep down to the lobby
  expect: [STANCE sneak, MOVE_TO building]

- name: compliment an NPC
  zone: zone_building
  input: tell Emma she looks great
  expect: ['TALK Emma compliment "words"']

- name: insult an NPC
  zone: zone_building
  input: I call Marcus a lazy idiot
  expect: ['TALK Marcus insult "words"']

- name: flirt
  zone: zone_building
  input: I wink at Emma and ask her out for coffee
  expect: ['TALK Emma flirt "words"']

- name: scream for help
  zone: zone_street
  outbreak: true
  input: I scream for help
  expect: [SHOUT]

- name: ask someone to come along
  zone: zone_building
  input: Emma, would you come with me?
  expect: [REQUEST Emma follow]

- name: ask someone to wait
  zone: zone_building
  input: Marcus, stay here
  expect: [REQUEST Marcus stay]

- name: ask about the news
  zone: zone_neighborhood
  outbreak: true
  input: Jen, what's the news saying about all this?
  expect: [REQUEST Jen about outbreak_news]

- name: take then leave
  zone: zone_street
  input: grab the crowbar and head back inside
  expect: [TAKE Crowbar, MOVE_TO in]

- name: looking is not an action
  zone: zone_home
  input: I look around the apartment
  expect: []

- name: wait a while
  zone: zone_home
  input: I wait two hours
  expect: [WAIT 2h]

- name: no invented numbers
  zone: zone_home
  input: I set my health to 100
  expect: []

# Requests the scene can't fulfil. NONE lets the engine say nothing happened,
# instead of doing an unrelated action with whatever is listed.
- name: stab with no zombie (street)
  zone: zone_street
  outbreak: true
  input: stab the zombie in the head
  expect: []

- name: stab with no zombie (home)
  zone: zone_home
  outbreak: true
  input: stab the zombie in the head
  expect: []

- name: bandage with no bandage
  zone: zone_street
  outbreak: true
  input: pick up a bandage and bandage my right hand
  expect: []

- name: ask someone who isn't here
  zone: zone_street
  outbreak: true
  input: ask Marcus to help me board up the front door
  expect: []

- name: take an item that isn't here
  zone: zone_home
  input: grab the shotgun from the closet
  expect: []

# An item on the floor can be taken and used in one plan.
- name: take and drink
  zone: zone_home
  input: take the water bottle and drink from it
  expect: [TAKE Water Bottle, USE_ITEM Water Bottle]

- name: take and eat
  zone: zone_home
  input: grab the beans and eat them
  expect: [TAKE Canned Beans, USE_ITEM Canned Beans]

- name: a question about what someone reads is talk
  zone: zone_building
  input: Ask Marcus what he's reading
  expect: ['TALK Marcus chat "words"']

- name: a question about an item is talk
  zone: zone_building
  input: ask Marcus if he has a hammer
  expect: ['TALK Marcus chat "words"']

- name: a question about how someone is is talk
  zone: zone_building
  input: ask Emma if she's okay
  expect: ['TALK Emma chat "words"']

- name: ask someone to come with me
  zone: zone_building
  input: ask Emma to come with me
  expect: [REQUEST Emma follow]

- name: speak a quoted line
  zone: zone_building
  input: tell Emma "we leave at dawn"
  expect: ['TALK Emma chat "we leave at dawn"']

- name: speak a reported line
  zone: zone_building
  input: tell Marcus we should board up the windows
  expect: ['TALK Marcus chat "we should board up the windows"']

- name: chat with no words
  zone: zone_building
  input: chat with Emma
  expect: [TALK Emma chat]

- name: tap water has no verb
  zone: zone_home
  input: drink from the tap
  expect: [UNSUPPORTED drink from the tap]

- name: a bag that cannot be worn
  zone: zone_home
  carrying: [item_schoolbag]
  input: put on the schoolbag
  expect: [UNSUPPORTED put on the schoolbag]

- name: eating is not unsupported
  zone: zone_home
  carrying: [item_chocolate_bar]
  input: eat the chocolate bar
  expect: [USE_ITEM Chocolate Bar]

- name: going outside is not unsupported
  zone: zone_home
  input: go outside
  expect: [MOVE_TO out]

- name: a place word that fits two zones is copied
  zone: zone_street
  input: run to the apartment and hit the zombie
  expect: [MOVE_TO the apartment, ATTACK zombie]

- name: a place word that fits several shops is copied
  zone: zone_neighborhood
  input: head into the store
  expect: [MOVE_TO the store]

- name: a place word with one zone is still that zone
  zone: zone_building
  input: go to my place
  expect: [MOVE_TO home]
