[tools]
python = "3.13"
uv = "latest"

[settings]
python.uv_venv_auto = true

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.install]
run = "uv pip install -r requirements.txt -r requirements-dev.txt"

[tasks.dev]
run = "python app.py"

[tasks.test]
description = "Run the tests on 2 workers (RPG_TEST_JOBS to change)"
run = "unittest-parallel -j ${RPG_TEST_JOBS:-2} -s tests -t . -b"

[tasks.test-serial]
description = "Run the tests in one process (for debugging test order)"
run = "python -m unittest discover -s tests -t . -b"

[tasks.fmt]
description = "Format and auto-fix lint"
run = ["ruff format .", "ruff check --fix ."]

[tasks.lint]
description = "Lint, format check, and layer contracts"
run = ["ruff check .", "ruff format --check .", "lint-imports"]

[tasks.typecheck]
description = "Type check (only errors beyond .basedpyright/baseline.json fail)"
run = "basedpyright"

[tasks.check]
description = "Everything CI would run"
depends = ["lint", "typecheck", "test"]
