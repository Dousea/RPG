# RPG configuration. Copy of the defaults previously hardcoded across
# adapters/ and managers/ -- change values here rather than in code.

llm:
  # LM Studio (or any OpenAI-compatible server)'s chat completions endpoint.
  base_url: "http://localhost:1234/v1/chat/completions"
  # The narrator's model key in LM Studio. With one model loaded LM Studio
  # ignores it; with several (the narrator and the factcheck model) it must
  # name the narrator's loaded model.
  model_name: "local-model"
  # The parser's model key in LM Studio, when it differs from the narrator's;
  # empty means the narrator's model parses too. LM Studio loads it on first use.
  parser_model_name: ""
  # Seconds to wait for a response before giving up.
  request_timeout: 300
  # Sampler settings per call, as the loaded model's card recommends:
  # temperature, top_k, top_p, min_p, repeat_penalty. A setting left out keeps
  # the default here for temperature and LM Studio's default for the rest;
  # anything else is ignored with a warning. The parser stays cool: it proposes
  # actions, not prose. Example for Gemma 4:
  #   narrator_sampler: {temperature: 1.0, top_k: 64, top_p: 0.95, min_p: 0.0, repeat_penalty: 1.0}
  narrator_sampler: {temperature: 0.7}
  parser_sampler: {temperature: 0.2}
  summarizer_sampler: {temperature: 0.5}
  # Thinking per call for a model that can think: none, low, medium or high.
  # The hidden reasoning counts against the reply cap below, so raise the cap
  # when turning it on, or the reply can come back empty.
  narrator_reasoning_effort: "none"
  parser_reasoning_effort: "none"
  summarizer_reasoning_effort: "none"
  # The loaded model's context window, in tokens; the narrator prompt is cut to fit it.
  context_tokens: 8192
  # Reply caps, in tokens, per call.
  narrator_max_tokens: 800
  parser_max_tokens: 400
  summarizer_max_tokens: 300

memory:
  # sentence-transformers model used to embed events for semantic recall.
  embedding_model_name: "all-MiniLM-L6-v2"
  # Output dimension of embedding_model_name; must match the model.
  embedding_dimension: 384
  # Number of past events recalled per turn via semantic search.
  default_recall: 2

factcheck:
  # A decision model answers multiple-choice questions about each turn. Before
  # anything runs: is each parsed action what the player asked for, and why
  # can't an unsupported request be done? After the narrator: does the story
  # contradict the engine (was the zombie killed? did a refused action happen?
  # was a search with finds called bare?). false skips both checks.
  enabled: true
  # The decision model's key in LM Studio, served from the llm section's base_url:
  # a small one loaded next to the narrator (Tev1-4B GGUF, about 2.8 GB at Q4_K_M),
  # or the narrator's own llm.model_name when there is no room for a second model.
  model_name: "togethercomputer_tev1-4b-experimental"
  # A confident answer that conflicts with the engine counts at or above this
  # probability. "Unclear" never conflicts.
  conflict_threshold: 0.9
  # Seconds to wait for the one-letter answer before the check is skipped.
  request_timeout: 30

game:
  # Number of recent events kept in the prompt as short-term memory.
  max_recent_events: 5
  # Once the recent-event buffer is this full, the older half is summarized.
  summary_threshold: 10

persistence:
  # Directory holding save data and the game data JSON files.
  game_data_dir: "gamedata"
  # Save file name, relative to game_data_dir.
  save_file_name: "engine_state.json"

server:
  host: "127.0.0.1"
  port: 5000
  debug: true
