# RPG configuration. Copy of the defaults previously hardcoded across
# adapters/ and managers/ -- change values here rather than in code.

llm:
  # LM Studio (or any OpenAI-compatible server)'s chat completions endpoint.
  base_url: "http://localhost:1234/v1/chat/completions"
  # LM Studio serves whatever model is loaded locally; this value is mostly
  # ignored by LM Studio but is required by the API shape.
  model_name: "local-model"
  # Seconds to wait for a response before giving up.
  request_timeout: 300
  # Sampling temperature for the intent parser (proposes actions, not prose).
  parser_temperature: 0.2
  # Sampling temperature for the narrator's prose turns.
  narrator_temperature: 0.7
  # Sampling temperature for summarizing old events.
  summarizer_temperature: 0.5
  # The loaded model's context window, in tokens; the narrator prompt is cut to fit it.
  context_tokens: 8192
  # Reply caps, in tokens, per call.
  narrator_max_tokens: 800
  parser_max_tokens: 400
  summarizer_max_tokens: 300

memory:
  # sentence-transformers model used to embed events for semantic recall.
  embedding_model_name: "all-MiniLM-L6-v2"
  # Output dimension of embedding_model_name; must match the model.
  embedding_dimension: 384
  # Number of past events recalled per turn via semantic search.
  default_recall: 2

game:
  # Number of recent events kept in the prompt as short-term memory.
  max_recent_events: 5
  # Once the recent-event buffer is this full, the older half is summarized.
  summary_threshold: 10

persistence:
  # Directory holding save data and the game data JSON files.
  game_data_dir: "gamedata"
  # Save file name, relative to game_data_dir.
  save_file_name: "engine_state.json"

server:
  host: "127.0.0.1"
  port: 5000
  debug: true
