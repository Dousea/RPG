<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local LLM RPG</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Simple, old-school terminal font */
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        body {
            font-family: 'VT323', monospace;
            background-color: #0a0a0a;
            color: #00ff41;
        }
        /* Custom scrollbar for the story display */
        #story-display::-webkit-scrollbar {
            width: 8px;
        }
        #story-display::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        #story-display::-webkit-scrollbar-thumb {
            background-color: #00ff41;
            border-radius: 4px;
        }
        /* Blinking cursor effect */
        .blinking-cursor {
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            50% {
                opacity: 0;
            }
        }
    </style>
</head>
<body class="flex flex-col h-screen p-4 md:p-6 lg:p-8">

    <header class="flex-shrink-0 flex justify-between items-center border-b-2 border-green-500 pb-2 mb-4">
        <h1 class="text-3xl md:text-4xl">Local LLM RPG</h1>
        <button id="reset-button" class="text-sm border border-red-500 text-red-500 px-3 py-1 rounded hover:bg-red-500 hover:text-black transition-colors">
            Reset Game
        </button>
    </header>

    <main class="flex-grow flex flex-col md:flex-row gap-4 overflow-hidden">
        
        <!-- Left Panel: Story Display -->
        <div id="story-display" class="w-full md:w-2/3 h-64 md:h-full bg-black/50 border-2 border-green-700 rounded-lg p-4 overflow-y-auto text-lg leading-relaxed">
            <p>Welcome, Orton. The adventure begins...</p>
        </div>

        <!-- Right Panel: Game State -->
        <div class="w-full md:w-1/3 flex-shrink-0 bg-black/50 border-2 border-green-700 rounded-lg p-4 flex flex-col gap-4 overflow-y-auto">
            <div>
                <h2 class="text-2xl border-b border-green-500/50 mb-2">LOCATION</h2>
                <p id="location-status" class="text-xl">&mdash;</p>
                <p id="time-status" class="text-lg text-green-300/70">&mdash;</p>
            </div>
            <div>
                <h2 class="text-2xl border-b border-green-500/50 mb-2">CONDITION</h2>
                <p id="condition-status" class="text-lg">&mdash;</p>
            </div>
            <div>
                <h2 class="text-2xl border-b border-green-500/50 mb-2">INVENTORY</h2>
                <ul id="inventory-list" class="list-disc list-inside text-xl">
                    <li class="text-green-300/50">(empty)</li>
                </ul>
            </div>
            <div>
                <h2 class="text-2xl border-b border-green-500/50 mb-2">PRESENT</h2>
                <ul id="npc-list" class="list-disc list-inside text-xl">
                    <li class="text-green-300/50">(no one)</li>
                </ul>
            </div>
            <div>
                <h2 class="text-2xl border-b border-green-500/50 mb-2">GOALS</h2>
                <ul id="goal-list" class="list-disc list-inside text-lg">
                    <li class="text-green-300/50">(none)</li>
                </ul>
            </div>
        </div>

    </main>

    <footer class="flex-shrink-0 mt-4">
        <form id="input-form" class="flex items-center gap-2">
            <label for="player-input" class="text-2xl">&gt;</label>
            <input type="text" id="player-input" class="w-full bg-transparent border-b-2 border-green-500 focus:outline-none text-xl p-2" autocomplete="off" placeholder="What do you do?">
            <button type="submit" id="submit-button" class="bg-green-700 text-black px-6 py-2 rounded-md hover:bg-green-500 transition-colors">
                SEND
            </button>
        </form>
    </footer>

    <script>
        // DOM Element References
        const storyDisplay = document.getElementById('story-display');
        const locationStatus = document.getElementById('location-status');
        const timeStatus = document.getElementById('time-status');
        const conditionStatus = document.getElementById('condition-status');
        const inventoryList = document.getElementById('inventory-list');
        const npcList = document.getElementById('npc-list');
        const goalList = document.getElementById('goal-list');
        const inputForm = document.getElementById('input-form');
        const playerInput = document.getElementById('player-input');
        const submitButton = document.getElementById('submit-button');
        const resetButton = document.getElementById('reset-button');

        // Render a list, falling back to a dimmed placeholder when empty.
        function renderList(element, items, emptyLabel) {
            element.innerHTML = '';
            if (!items || items.length === 0) {
                const li = document.createElement('li');
                li.className = 'text-green-300/50 list-none';
                li.textContent = emptyLabel;
                element.appendChild(li);
                return;
            }
            items.forEach(item => {
                const li = document.createElement('li');
                li.textContent = item;
                element.appendChild(li);
            });
        }

        // Append one story beat. Player input is set as text, never HTML, so a
        // '<' in what the player types cannot break out into markup.
        function appendStory(playerText, storyText) {
            const paragraph = document.createElement('p');
            if (playerText) {
                const echo = document.createElement('span');
                echo.className = 'text-green-300/50';
                echo.textContent = `> ${playerText}`;
                paragraph.appendChild(echo);
                paragraph.appendChild(document.createElement('br'));
            }
            paragraph.appendChild(document.createTextNode(storyText));
            paragraph.classList.add('whitespace-pre-wrap');
            storyDisplay.appendChild(document.createElement('hr'));
            storyDisplay.appendChild(paragraph);
            storyDisplay.scrollTop = storyDisplay.scrollHeight;
        }

        // Refresh the side panel from a state payload.
        function updatePanel(data) {
            locationStatus.textContent = data.current_location;
            timeStatus.textContent =
                `Day ${data.day} - ${data.time_of_day} - ${data.apocalypse_stage}`;
            conditionStatus.textContent = data.condition;
            renderList(inventoryList, data.inventory, '(empty)');
            renderList(npcList, data.npcs_present, '(no one)');

            const goals = data.goals || { short_term: [], long_term: [] };
            const labelled = [
                ...(goals.short_term || []).map(g => `[short] ${g}`),
                ...(goals.long_term || []).map(g => `[long] ${g}`),
            ];
            renderList(goalList, labelled, '(none)');
        }

        function updateUI(data, playerText) {
            if (data.story_text) {
                appendStory(playerText, data.story_text);
            }
            updatePanel(data);
        }

        // Function to handle form submission
        async function handleTurn(event) {
            event.preventDefault();
            const inputText = playerInput.value.trim();
            if (!inputText) return;

            // Disable form while waiting for response
            playerInput.disabled = true;
            submitButton.disabled = true;
            submitButton.textContent = 'THINKING...';

            try {
                const response = await fetch('/play', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ input: inputText })
                });

                if (!response.ok) {
                    throw new Error(`Server responded with status: ${response.status}`);
                }

                const data = await response.json();
                updateUI(data, inputText);

            } catch (error) {
                console.error('Error during game turn:', error);
                const errorParagraph = document.createElement('p');
                errorParagraph.className = 'text-red-500';
                errorParagraph.textContent = `--- SYSTEM ERROR ---\n${error.message}`;
                storyDisplay.appendChild(errorParagraph);
                storyDisplay.scrollTop = storyDisplay.scrollHeight;
            } finally {
                // Re-enable form
                playerInput.value = '';
                playerInput.disabled = false;
                playerInput.focus();
                submitButton.disabled = false;
                submitButton.textContent = 'SEND';
            }
        }
        
        // Function to reset the game
        async function handleReset() {
            if (!confirm("Are you sure you want to reset the game? All progress will be lost.")) {
                return;
            }
            try {
                const response = await fetch('/reset', { method: 'POST' });
                const data = await response.json();
                alert(data.message);
                window.location.reload(); // Reload the page to see the fresh state
            } catch (error) {
                console.error('Error resetting game:', error);
                alert('Failed to reset the game.');
            }
        }

        // Load the real world state so a reloaded page is not showing defaults.
        async function loadState() {
            try {
                const response = await fetch('/state');
                if (!response.ok) return;
                updatePanel(await response.json());
            } catch (error) {
                console.error('Could not load game state:', error);
            }
        }

        // Event Listeners
        inputForm.addEventListener('submit', handleTurn);
        resetButton.addEventListener('click', handleReset);

        loadState();

        // Give focus to the input box on page load
        playerInput.focus();
    </script>

</body>
</html>
